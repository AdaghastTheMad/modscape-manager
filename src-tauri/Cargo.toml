[package]
name = "modpack-planner"
version = "0.1.0"
description = "Plan Minecraft modpacks as metadata, without downloading mods"
authors = ["AdaghastTheMad"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "modpack_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
uuid = { version = "1.29.3", features = ["v4"] }
futures = "0.3.34"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tiny_http = "0.12.0"

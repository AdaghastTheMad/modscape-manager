[package]
name = "modpack-planner"
version = "0.1.0"
description = "Plan Minecraft modpacks as metadata, without downloading mods"
authors = ["AdaghastTheMad"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "modpack_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

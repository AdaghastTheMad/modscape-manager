# Builds the Windows installer (NSIS .exe) on a GitHub-hosted Windows runner.
# Runs the same checks as scripts/build.sh first: typecheck and the Rust tests.
#
# Trigger: push to master, by hand (Actions → Windows build → Run workflow),
# or a v* tag, which also attaches the installer to that tag's GitHub release.
name: Windows build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript packages
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --quiet

      - name: Build the installer
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: modscape-manager-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Modscape Manager ${GITHUB_REF_NAME#v} (Windows)" --notes "Windows installer. See docs/WINDOWS.md."
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe --clobber
